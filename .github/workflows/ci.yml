name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      JWT_SECRET: ci-only-secret-not-used-in-production
      MONGO_URL: mongodb://127.0.0.1:1/?serverSelectionTimeoutMS=10
      DB_NAME: crelith_ci
      RUN_EXTERNAL_TESTS: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run isolated test suite
        run: python -m pytest -q

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Enable pinned Yarn version
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install locked dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Run tests
        run: yarn test --watchAll=false --runInBand --coverage
        env:
          CI: "true"

      - name: Verify translations
        run: yarn verify:i18n

      - name: Build production bundle
        run: yarn build
        env:
          CI: "true"

      - name: Enforce bundle budget
        run: yarn verify:bundle

      - name: Verify PWA artifacts
        run: yarn verify:pwa

      - name: Audit production dependencies
        run: yarn audit:production
