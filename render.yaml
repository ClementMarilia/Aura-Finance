services:
  - type: web
    name: name-aura-finance-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /api/health
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: JWT_ISSUER
        value: crelith-finance
      - key: JWT_AUDIENCE
        value: crelith-web
      - key: ACCESS_TOKEN_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_DAYS
        value: "30"
      - key: SESSION_IDLE_MINUTES
        value: "30"
      - key: MAX_SIMULTANEOUS_SESSIONS
        value: "5"
      - key: REFRESH_COOKIE_SAMESITE
        value: lax
      - key: AUDIT_RETENTION_DAYS
        value: "365"
      - key: ADMIN_EMAILS
        value: clementmarilia@gmail.com
      - key: SEED_DEMO
        value: "false"
      - key: CORS_ORIGINS
        value: https://www.crelithtech.com,https://crelithtech.com,https://aura-finance-inky.vercel.app
      - key: EMERGENT_LLM_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM_NAME
        value: Crelith Finance
      - key: EMAIL_FROM_ADDRESS
        sync: false
      - key: EMAIL_REPLY_TO
        sync: false
      - key: PASSWORD_RESET_URL
        value: https://www.crelithtech.com/redefinir-senha
      - key: PASSWORD_RESET_EXPIRES_MINUTES
        value: "30"
