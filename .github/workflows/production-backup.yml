name: Production database backup

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-database-backup
  cancel-in-progress: false

jobs:
  backup-and-restore-drill:
    name: Encrypted backup and isolated restore drill
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGODB_URI_BACKUP: ${{ secrets.MONGODB_URI_BACKUP }}
      MONGODB_DATABASE: ${{ secrets.MONGODB_DATABASE }}
      BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
      BACKUP_OUTPUT_DIR: ${{ github.workspace }}/backup-output
      RESTORE_MONGODB_URI: mongodb://127.0.0.1:27017
      RESTORE_DATABASE: crelith_restore_test
      RESTORE_REPORT_PATH: ${{ github.workspace }}/backup-output/restore-report.json

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "$MONGODB_URI_BACKUP" ]] || { echo "Missing MONGODB_URI_BACKUP" >&2; exit 1; }
          [[ -n "$MONGODB_DATABASE" ]] || { echo "Missing MONGODB_DATABASE" >&2; exit 1; }
          [[ ${#BACKUP_ENCRYPTION_PASSPHRASE} -ge 32 ]] || { echo "BACKUP_ENCRYPTION_PASSPHRASE must contain at least 32 characters" >&2; exit 1; }

      - name: Install MongoDB database tools and shell
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL https://www.mongodb.org/static/pgp/server-8.0.asc | sudo gpg --dearmor --yes -o /usr/share/keyrings/mongodb-server-8.0.gpg
          echo "deb [arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb-server-8.0.gpg] https://repo.mongodb.org/apt/ubuntu noble/mongodb-org/8.0 multiverse" | sudo tee /etc/apt/sources.list.d/mongodb-org-8.0.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y mongodb-database-tools mongodb-mongosh

      - name: Create encrypted backup
        shell: bash
        run: ./scripts/mongodb_backup.sh

      - name: Restore into isolated database and verify
        shell: bash
        run: |
          set -Eeuo pipefail
          export BACKUP_ARCHIVE
          export BACKUP_MANIFEST
          BACKUP_ARCHIVE="$(find "$BACKUP_OUTPUT_DIR" -maxdepth 1 -name '*.archive.gz.gpg' -type f -print -quit)"
          BACKUP_MANIFEST="$(find "$BACKUP_OUTPUT_DIR" -maxdepth 1 -name '*.manifest.json' -type f -print -quit)"
          ./scripts/mongodb_restore_drill.sh

      - name: Upload encrypted backup and restore evidence
        uses: actions/upload-artifact@v4
        with:
          name: crelith-production-backup-${{ github.run_id }}
          path: backup-output/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          include-hidden-files: false
