name: Refresh frontend lockfile

on:
  push:
    branches:
      - feature/linked-counterparty-transactions

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/linked-counterparty-transactions

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Enable pinned Yarn version
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Refresh lockfile
        working-directory: frontend
        run: yarn install --non-interactive

      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- frontend/yarn.lock; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/yarn.lock
          git commit -m "chore: refresh frontend lockfile"
          git push origin HEAD:feature/linked-counterparty-transactions
